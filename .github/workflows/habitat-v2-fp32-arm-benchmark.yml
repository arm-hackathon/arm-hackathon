name: Habitat V2 FP32 native Arm64 benchmark

on:
  push:
    branches:
      - ben/habitat-v2-fp32-arm-benchmark
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: habitat-v2-fp32-arm-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-arm64-benchmark:
    name: FP64 versus FP32 on native Arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONPATH: src
      EVIDENCE_ROOT: out/habitat-v2-fp32-arm/evidence

    steps:
      - name: Check out benchmark branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install bounded runtime and test tools
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -e . \
            "numpy==2.4.6" \
            "pytest==9.1.1" \
            "ruff==0.12.12"

      - name: Verify implementation
        run: |
          python -m ruff check \
            src/aeolus/habitat_v2/forecast/arm_optimization.py \
            scripts/benchmark_habitat_v2_fp32.py \
            tests/habitat_v2/test_forecast_arm_optimization.py
          python -m ruff format --check \
            src/aeolus/habitat_v2/forecast/arm_optimization.py \
            scripts/benchmark_habitat_v2_fp32.py \
            tests/habitat_v2/test_forecast_arm_optimization.py
          python -m pytest -q tests/habitat_v2/test_forecast_*.py
          git show --check --oneline --format=fuller "$GITHUB_SHA"

      - name: Capture native architecture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_ROOT"
          uname -a | tee "$EVIDENCE_ROOT/uname.txt"
          lscpu | tee "$EVIDENCE_ROOT/lscpu.txt"
          python - <<'PY'
          import platform
          machine = platform.machine().lower()
          if machine not in {"aarch64", "arm64"}:
              raise SystemExit(f"not a native Arm64 runner: {machine}")
          PY

      - name: Regenerate exact candidate and benchmark
        run: |
          python scripts/benchmark_habitat_v2_fp32.py \
            --candidate "$EVIDENCE_ROOT/action-aware-ridge-fp32.npz" \
            --conversion-receipt "$EVIDENCE_ROOT/fp32-conversion-receipt.json" \
            --benchmark-receipt "$EVIDENCE_ROOT/benchmark-receipt.json"
          cmp \
            artifacts/demo-only/habitat-v2-forecast/action-aware-ridge-fp32.npz \
            "$EVIDENCE_ROOT/action-aware-ridge-fp32.npz"
          cmp \
            artifacts/demo-only/habitat-v2-forecast/fp32-conversion-receipt.json \
            "$EVIDENCE_ROOT/fp32-conversion-receipt.json"

      - name: Write SHA-256 manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d "$EVIDENCE_ROOT" ]]; then
            find "$EVIDENCE_ROOT" -maxdepth 1 -type f ! -name SHA256SUMS \
              -printf '%f\n' | LC_ALL=C sort | while read -r file; do
                sha256sum "$EVIDENCE_ROOT/$file"
              done > "$EVIDENCE_ROOT/SHA256SUMS"
          fi

      - name: Upload native Arm64 benchmark evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: habitat-v2-fp32-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/habitat-v2-fp32-arm/evidence
          if-no-files-found: error
          retention-days: 30
