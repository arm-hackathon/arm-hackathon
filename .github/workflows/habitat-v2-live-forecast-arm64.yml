name: Habitat V2 live forecast Arm64 evidence

on:
  push:
    branches:
      - ben/habitat-v2-live-forecast-demo
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: habitat-v2-live-forecast-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-arm64-evidence:
    name: Native Arm64 forecast and replay
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20

    steps:
      - name: Check out candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Prove native architecture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/habitat-v2-live-forecast-demo/arm64-evidence
          uname -a | tee out/habitat-v2-live-forecast-demo/arm64-evidence/uname.txt
          lscpu | tee out/habitat-v2-live-forecast-demo/arm64-evidence/lscpu.txt
          python - <<'PY'
          import platform
          machine = platform.machine().lower()
          print(f"platform.machine={machine}")
          if machine not in {"aarch64", "arm64"}:
              raise SystemExit(f"not a native Arm64 runner: {machine}")
          PY

      - name: Install the bounded runtime and test tools
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -e . \
            "numpy==2.4.6" \
            "pytest==9.1.1" \
            "ruff==0.12.12"

      - name: Static verification
        run: |
          python -m ruff check \
            src/aeolus/habitat_v2/forecast/live_demo.py \
            src/aeolus/habitat_v2/forecast/live_demo_report.py \
            scripts/run_habitat_v2_live_forecast.py \
            scripts/verify_habitat_v2_live_forecast_demo.py \
            tests/habitat_v2/test_forecast_live_demo.py
          python -m py_compile \
            src/aeolus/habitat_v2/forecast/live_demo.py \
            src/aeolus/habitat_v2/forecast/live_demo_report.py \
            scripts/run_habitat_v2_live_forecast.py \
            scripts/verify_habitat_v2_live_forecast_demo.py \
            tests/habitat_v2/test_forecast_live_demo.py
          git show --check --oneline --format=fuller "$GITHUB_SHA"

      - name: Run all Habitat V2 forecast tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/habitat_v2/test_forecast_*.py

      - name: Run live inference inside the simulator
        id: live_run
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          output=out/habitat-v2-live-forecast-demo/arm64-evidence/live-run-arm64
          start_ns=$(date +%s%N)
          python scripts/run_habitat_v2_live_forecast.py \
            --output "$output" \
            --integration-source-commit "$GITHUB_SHA" \
            | tee out/habitat-v2-live-forecast-demo/arm64-evidence/run-summary.json
          end_ns=$(date +%s%N)
          echo "elapsed_ns=$((end_ns-start_ns))" >> "$GITHUB_OUTPUT"

      - name: Replay and verify the exact Arm64 report
        env:
          PYTHONPATH: src
        run: |
          python scripts/verify_habitat_v2_live_forecast_demo.py \
            --report out/habitat-v2-live-forecast-demo/arm64-evidence/live-run-arm64 \
            --expected-integration-commit "$GITHUB_SHA" \
            | tee out/habitat-v2-live-forecast-demo/arm64-evidence/verification-summary.json

      - name: Write native Arm64 environment receipt
        env:
          LIVE_RUN_ELAPSED_NS: ${{ steps.live_run.outputs.elapsed_ns }}
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import importlib.metadata
          import json
          import os
          import platform
          from pathlib import Path

          root = Path("out/habitat-v2-live-forecast-demo/arm64-evidence")
          model = Path("artifacts/demo-only/habitat-v2-forecast/action-aware-ridge.npz")
          report_receipt = root / "live-run-arm64/receipt.json"
          machine = platform.machine().lower()
          if machine not in {"aarch64", "arm64"}:
              raise SystemExit(f"not native Arm64: {machine}")
          receipt = {
              "schema_version": "aeolus_habitat_v2_live_forecast_arm64_environment_v1",
              "native_arm64": True,
              "platform_machine": machine,
              "runner_arch": os.environ.get("RUNNER_ARCH"),
              "runner_os": os.environ.get("RUNNER_OS"),
              "python_version": platform.python_version(),
              "numpy_version": __import__("numpy").__version__,
              "pytest_version": importlib.metadata.version("pytest"),
              "ruff_version": importlib.metadata.version("ruff"),
              "git_commit": os.environ["GITHUB_SHA"],
              "github_repository": os.environ["GITHUB_REPOSITORY"],
              "github_run_id": os.environ["GITHUB_RUN_ID"],
              "github_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "model_sha256": hashlib.sha256(model.read_bytes()).hexdigest(),
              "live_run_receipt_sha256": hashlib.sha256(
                  report_receipt.read_bytes()
              ).hexdigest(),
              "live_run_elapsed_ns": int(os.environ["LIVE_RUN_ELAPSED_NS"]),
              "qualification_evidence": False,
              "actuator_authority": False,
          }
          raw = json.dumps(
              receipt,
              sort_keys=True,
              separators=(",", ":"),
              ensure_ascii=False,
          ).encode("utf-8")
          (root / "arm64-environment.json").write_bytes(raw)
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - name: Write evidence manifest
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("out/habitat-v2-live-forecast-demo/arm64-evidence")
          entries = []
          for path in sorted(item for item in root.rglob("*") if item.is_file()):
              raw = path.read_bytes()
              entries.append(
                  {
                      "relative_path": path.relative_to(root).as_posix(),
                      "byte_length": len(raw),
                      "sha256": hashlib.sha256(raw).hexdigest(),
                  }
              )
          manifest = {
              "schema_version": "aeolus_habitat_v2_live_forecast_arm64_manifest_v1",
              "files": entries,
          }
          (root / "manifest.json").write_text(
              json.dumps(manifest, sort_keys=True, separators=(",", ":")),
              encoding="utf-8",
          )
          PY

      - name: Upload native Arm64 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: habitat-v2-live-forecast-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/habitat-v2-live-forecast-demo/arm64-evidence
          if-no-files-found: error
          retention-days: 30
